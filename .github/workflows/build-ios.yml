name: Build iOS app (unsigned)
# Compiles room-scanner/ios on a macOS runner and uploads an unsigned .ipa you can sideload from Windows
# (Sideloadly / AltStore with a free Apple ID). Run manually: Actions tab -> "Build iOS app (unsigned)" -> Run workflow.
on:
  workflow_dispatch:
  push:
    paths: ['room-scanner/ios/**', '.github/workflows/build-ios.yml']
jobs:
  build:
    runs-on: macos-14
    defaults: { run: { working-directory: room-scanner/ios } }
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app && xcodebuild -version
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild -project RoomScanner.xcodeproj -scheme RoomScanner -sdk iphoneos -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/RoomScanner.app
      - name: Package .ipa
        run: |
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/RoomScanner.app Payload/
          zip -qr RoomScanner-unsigned.ipa Payload
      - name: Unit tests (simulator)
        continue-on-error: true
        run: xcodebuild -project RoomScanner.xcodeproj -scheme RoomScanner -destination 'platform=iOS Simulator,name=iPhone 15' test CODE_SIGNING_ALLOWED=NO 2>&1 | tail -40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RoomScanner-unsigned-ipa
          path: |
            room-scanner/ios/RoomScanner-unsigned.ipa
            room-scanner/ios/build.log
