name: Build iOS app (unsigned)
# Compiles room-scanner/ios on a macOS runner and uploads an unsigned .ipa you can sideload from Windows
# (Sideloadly / AltStore with a free Apple ID). Run manually: Actions tab -> "Build iOS app (unsigned)" -> Run workflow.
on:
  workflow_dispatch:
  push:
    paths: ['room-scanner/ios/**', '.github/workflows/build-ios.yml']
jobs:
  build:
    runs-on: macos-15
    defaults: { run: { working-directory: room-scanner/ios } }
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Select newest Xcode 16
        run: |
          ls /Applications | grep -i xcode || true
          X=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1); echo "using $X"; sudo xcode-select -s "$X"; xcodebuild -version
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Diagnose project
        run: |
          head -12 RoomScanner.xcodeproj/project.pbxproj; xcodebuild -list -project RoomScanner.xcodeproj 2>&1 | head -30
      - name: Build (no signing)
        run: |
          xcodebuild -project RoomScanner.xcodeproj -scheme RoomScanner -sdk iphoneos -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 && echo "BUILD OK" || { echo "BUILD FAILED"; grep -E "error:" build.log | sort -u | head -60; exit 1; }
      - name: Package .ipa
        run: |
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/RoomScanner.app Payload/
          zip -qr RoomScanner-unsigned.ipa Payload
      - name: Unit tests (simulator)
        continue-on-error: true
        run: |
          xcodebuild -project RoomScanner.xcodeproj -scheme RoomScanner -destination 'platform=iOS Simulator,name=iPhone 17' test CODE_SIGNING_ALLOWED=NO > test.log 2>&1 && echo "TESTS PASSED" || { echo "TESTS FAILED"; grep -E "error:|failed|Executed" test.log | sort -u | head -40; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RoomScanner-unsigned-ipa
          path: |
            room-scanner/ios/RoomScanner-unsigned.ipa
            room-scanner/ios/build.log
